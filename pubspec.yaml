name: odin_sql
description: A mobile SQL Server management studio.
publish_to: none
version: 0.2.1+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^10.3.7
  mssql_native: ^0.2.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.4
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/odinsql_launcher.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/odinsql_launcher.png
  min_sdk_android: 24

