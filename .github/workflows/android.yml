name: Android debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name=odin_sql --org=com.odin
      - name: Allow SQL Server TCP connections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          contents = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in contents:
              contents = contents.replace("<manifest", "<manifest", 1)
              tag_end = contents.index(">")
              contents = contents[:tag_end+1] + "\n    " + permission + contents[tag_end+1:]
              path.write_text(contents)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: OdinSQL-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
